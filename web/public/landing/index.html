<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="data.js"></script>
<style>
:root{--cream:#F4EEE3;--paper:#FBF8F2;--ink:#1C1A17;--rust:#D4523A;--muted:#8A8175;--line:#E2D8C7;--green:#6F9A3B}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--cream)}
body{font-family:Geist,system-ui,sans-serif;color:var(--ink);background:var(--cream);overflow-x:hidden;-webkit-font-smoothing:antialiased}
.serif{font-family:'Instrument Serif',serif;font-weight:400;letter-spacing:-.01em}
.it{font-style:italic}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:'Geist Mono',monospace}
nav{position:fixed;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:center;padding:20px 36px;z-index:60}
.brand{transition:color .4s;font-weight:600;font-size:21px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--rust);display:inline-block}
.cta{display:inline-flex;gap:10px;align-items:center;background:var(--ink);color:var(--cream);text-decoration:none;padding:12px 20px;border-radius:999px;font-size:15px;font-weight:500;transition:transform .35s cubic-bezier(.2,.8,.2,1),background .35s}
.cta:hover{transform:translateY(-2px) scale(1.04);background:var(--rust)}
.cta .arr{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.cta:hover .arr{transform:translateX(4px)}
.stick{position:sticky;top:0;height:100vh;overflow:hidden}
section{position:relative}

/* HERO */
#hero{height:330vh}
.hero-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:4;pointer-events:none}
.h1{font-size:clamp(46px,8.4vw,132px);line-height:.92;font-weight:600;letter-spacing:-.045em}
.h1 .line{display:block;overflow:hidden;padding-bottom:.06em}
.h1 .line span{display:inline-block;transform:translateY(105%);animation:rise 1.1s cubic-bezier(.2,.8,.2,1) forwards}
.h1 .line:nth-child(2) span{animation-delay:.12s}
.h1 .serif{font-weight:400;letter-spacing:-.02em;color:var(--rust)}
@keyframes rise{to{transform:none}}
.sub{margin-top:26px;font-size:clamp(16px,1.5vw,20px);color:var(--muted);opacity:0;animation:fade 1s .6s forwards}
@keyframes fade{to{opacity:1}}
#dishes{position:absolute;left:50%;top:50%;width:0;height:0;z-index:3}
.dish{position:absolute;left:0;top:0;will-change:transform}
.plate{width:100%;overflow:hidden;position:relative;border:1px solid transparent}
.plate img{width:100%;height:100%;object-fit:cover;display:block;mix-blend-mode:multiply;will-change:transform}
.cap{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:15px;font-weight:500;opacity:0}
.cap .num{color:var(--muted);font-weight:400}
.menu-title{position:absolute;left:0;right:0;top:13vh;text-align:center;z-index:4;opacity:0}
.menu-title h2{font-size:clamp(34px,4.6vw,68px);letter-spacing:-.035em;font-weight:600;line-height:1}
.menu-title h2 .serif{color:var(--rust)}
.menu-title p{margin-top:10px;color:var(--muted)}
</style>
</head>
<body>
<nav><div class="brand"><i></i>Mise</div><a class="cta" href="/?seed=1" data-cur="Open">Open the kitchen <span class="arr">→</span></a></nav>

<section id="hero">
 <div class="stick">
  <div class="hero-text" id="heroText">
   <h1 class="h1"><span class="line"><span>Open a restaurant</span></span><span class="line"><span class="serif it">before you open one.</span></span></h1>
   <p class="sub">Describe it. Mise plates it, prices it, and runs a Friday in Pittsburgh.</p>
  </div>
  <div class="menu-title" id="menuTitle"><h2>An idea becomes <span class="serif it">a menu.</span></h2><p>Crunch House · 6 dishes · v3</p></div>
  <div id="dishes"></div>
 </div>
</section>

<footer><span>Mise · Built at NOVA 2026, ScottyLabs</span><span>Pittsburgh</span></footer>

<script>
const M=window.MISE, RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, out=t=>1-Math.pow(1-t,3);
const back=t=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const seg=(p,a,b)=>clamp((p-a)/(b-a));
const $=s=>document.querySelector(s);
const prog=el=>{const r=el.getBoundingClientRect();return clamp(-r.top/(r.height-innerHeight))};
const money=v=>'$'+Math.round(v).toLocaleString();
let mx=innerWidth/2,my=innerHeight/2,nmx=0,nmy=0;
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;nmx=mx/innerWidth-.5;nmy=my/innerHeight-.5});

const loops=[],resizers=[];let DPR=Math.min(devicePixelRatio||1,2);
const onView=(el,fn)=>{const o=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){o.disconnect();fn()}},{threshold:.35});o.observe(el)};

/* ---------- hero dishes ---------- */
const hero=$('#hero'),dEl=$('#dishes');
const heroDishes=M.menu.slice(0,6).map((m,i)=>{const d=document.createElement('div');d.className='dish';d.dataset.cur='Taste';
 d.innerHTML=`<div class="plate"><img src="d${i+1}.jpg" alt="${m.n}"></div><div class="cap"><span>${m.n}</span><span class="num">$${m.p.toFixed(2)}</span></div>`;dEl.appendChild(d);
 return{d,plate:d.firstChild,img:d.querySelector('img'),cap:d.querySelector('.cap'),hx:0,hy:0}});
let hp=0;
function heroFrame(t){const target=prog(hero);hp=RM?target:lerp(hp,target,.09);
 const e=ease(seg(hp,.1,.62)),vw=innerWidth,vh=innerHeight,mob=vw<760;
 const cols=mob?2:3,gap=mob?12:26,cw=mob?Math.min(vw*.42,200):Math.min(vw*.2,(vh*.62-2*56-gap)/2/.75,260),ch=cw*.75;
 const rows=Math.ceil(6/cols),gw=cols*cw+(cols-1)*gap,gh=rows*(ch+40)+(rows-1)*gap;
 const rx=mob?vw*.36:Math.min(vw*.43,780),ry=vh*(mob?.38:.37),osz=mob?100:Math.min(200,vw*.12);
 heroDishes.forEach((o,i)=>{
  const a=i/6*Math.PI*2-Math.PI/2+Math.PI/6+(RM?0:t*.00005)+hp*1.2;
  const depth=i%2?1:-.7;
  const ox=Math.cos(a)*rx+nmx*60*depth,oy=Math.sin(a)*ry+nmy*40*depth+Math.sin(t*.0012+i)*6;
  const c=i%cols,r=Math.floor(i/cols);
  const gx=-gw/2+c*(cw+gap)+cw/2,gy=-gh/2+r*(ch+40+gap)+ch/2+(mob?70:55);
  const w=lerp(osz,cw,e),h=lerp(osz,ch,e);
  const x=lerp(ox,gx,e),y=lerp(oy,gy,e);
  o.d.style.width=w+'px';o.d.style.transform=`translate(${x-w/2}px,${y-h/2}px)`;
  o.plate.style.height=h+'px';o.plate.style.borderRadius=lerp(w/2,16,e)+'px';
  o.plate.style.borderColor=`rgba(226,216,199,${e})`;o.plate.style.background=`rgba(239,230,214,${e})`;
  o.img.style.transform=`rotate(${lerp((RM?0:t*.012)+i*55,0,e)}deg) scale(${lerp(1.4,1,e)})`;
  o.cap.style.opacity=seg(hp,.58,.7);
 });
 const ht=$('#heroText');const f=seg(hp,.03,.3);ht.style.opacity=1-f;ht.style.transform=`translateY(${-f*60}px) scale(${1-f*.08})`;
 const mt=$('#menuTitle'),g=seg(hp,.55,.68);if(mt){mt.style.opacity=g;mt.style.transform=`translateY(${(1-g)*24}px)`}
 const cu=$('#cue');if(cu)cu.style.opacity=1-seg(hp,0,.06);
}

loops.push(heroFrame);

function resize(){DPR=Math.min(devicePixelRatio||1,2);resizers.forEach(f=>f())}
addEventListener('resize',resize);resize();
function frame(t){loops.forEach(f=>f(t));requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
</body>
</html>
